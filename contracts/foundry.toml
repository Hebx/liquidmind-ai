[profile.default]
src = 'src'
out = 'out'
libs = ['lib']
solc_version = '0.8.26'
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = 'cancun'
additional_compilers = ['0.8.24']

remappings = [
    'forge-std/=lib/forge-std/src/',
    'v4-core/=lib/v4-periphery/lib/v4-core/',
    'v4-periphery/=lib/v4-periphery/',
    '@openzeppelin/contracts/=lib/v4-periphery/lib/v4-core/lib/openzeppelin-contracts/contracts/',
    'solmate/=lib/v4-periphery/lib/v4-core/lib/solmate/',
    '@chainlink/contracts-ccip/=lib/chainlink-brownie-contracts/contracts/',
    '@chainlink/contracts/=lib/chainlink-brownie-contracts/contracts/'
]

[rpc_endpoints]
mainnet = "${ETH_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC}"
arbitrum = "${ARBITRUM_RPC_URL}"
optimism = "${OPTIMISM_RPC_URL}"
polygon = "${POLYGON_RPC_URL}"
